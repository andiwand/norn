[project]
name = "norn-hub"
version = "0.6.1"
readme = "README.md"
description = "A lightweight hub that brings all your home cameras into one modern web app"
requires-python = ">=3.13"
authors = [{ name = "Andreas Stefl" }]
license = "MIT"
keywords = ["camera", "cctv", "nvr", "webrtc", "go2rtc", "self-hosted", "home"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Home Automation",
]

dependencies = [
    "aiomqtt>=2.4",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "psutil>=7",
    "pydantic>=2.14.3",
    "pytapo>=3.4.31",
    "reolink-aio>=0.23.1",
    "ruamel-yaml>=0.19.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://andiwand.github.io/norn/"
Repository = "https://github.com/andiwand/norn"
Changelog = "https://github.com/andiwand/norn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Norn's own object detection (detect.py): pip install 'norn-hub[detect]'
detect = ["numpy>=2", "onnxruntime>=1.20"]

[project.scripts]
norn = "norn.__main__:main"

[dependency-groups]
dev = [
    "numpy>=2",
    "onnxruntime>=1.20",
    "pytest>=9",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# B027: optional hooks of the driver base class are empty on purpose.
# ASYNC109: explicit timeouts read better here than asyncio.timeout blocks.
# RUF001: × in resolutions like 640×480 is meant.
ignore = ["B027", "ASYNC109", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# SOAP bodies read better on one line.
"src/norn/onvif.py" = ["E501"]

[tool.uv.build-backend]
module-name = "norn"
